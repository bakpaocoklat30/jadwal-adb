name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug & Release APK
        working-directory: apps/android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload BelSekolahADB-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: BelSekolahADB-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload BelSekolahADB-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: BelSekolahADB-release-apk
          path: apps/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
